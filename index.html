<!doctype html>
<html>
  <head>
    <title>Siva Reddy | Student System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-10 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded shadow-lg">
      <h2 class="text-2xl font-bold mb-6 text-blue-700">Student Registry</h2>
      <div class="grid gap-4 mb-6">
        <input id="name" placeholder="Full Name" class="border p-2 rounded" />
        <input id="email" placeholder="Email" class="border p-2 rounded" />
        <input id="dept" placeholder="Department" class="border p-2 rounded" />
        <input
          id="gpa"
          placeholder="GPA"
          type="number"
          step="0.1"
          class="border p-2 rounded"
        />
        <button
          onclick="save()"
          class="bg-blue-600 text-white p-2 rounded font-bold"
        >
          Register Student
        </button>
      </div>
      <table class="w-full text-left">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-2">Name</th>
            <th class="p-2">Dept</th>
            <th class="p-2">GPA</th>
            <th class="p-2">Action</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

    <script>
      const url = "http://localhost:8081/api/students";

      async function load() {
        const res = await fetch(url);
        const data = await res.json();
        document.getElementById("list").innerHTML = data
          .map(
            (s) => `
                <tr class="border-b">
                    <td class="p-2">${s.name || "N/A"}</td>
                    <td class="p-2">${s.department || "N/A"}</td>
                    <td class="p-2">${s.gpa || "0.0"}</td>
                    <td class="p-2"><button onclick="del(${s.id})" class="text-red-500">Delete</button></td>
                </tr>`,
          )
          .join("");
      }

      async function save() {
        const student = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          department: document.getElementById("dept").value,
          gpa: parseFloat(document.getElementById("gpa").value) || 0.0,
        };
        await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(student),
        });
        load();
      }

      async function del(id) {
        await fetch(`${url}/${id}`, { method: "DELETE" });
        load();
      }
      load();
    </script>
  </body>
</html>
